<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Danz - Ultimate Streaming Experience</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');

    :root {
      --bg-color: #030712;
      --card-bg: #0f172a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    header {
      position: fixed; width: 100%; top: 0; z-index: 1000;
      background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      padding: 16px 5%; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); transition: 0.3s;
    }
    .logo { font-size: 1.6rem; font-weight: 800; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px; }
    .logo i { color: var(--primary); }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 8px 18px; border-radius: 20px; transition: 0.3s; }
    .nav-btn.active, .nav-btn:hover { color: #fff; background: var(--primary); border-color: var(--primary); box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
    
    .search-box { display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); }
    .search-box:focus-within { border-color: var(--primary); background: rgba(255, 255, 255, 0.08); }
    .search-box input { background: transparent; border: none; outline: none; color: #fff; margin-right: 10px; width: 150px; font-size: 0.85rem; }
    .search-box button { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; }

    .hero { position: relative; height: 70vh; width: 100%; background-size: cover; background-position: center top; display: flex; align-items: flex-end; padding: 60px 5%; margin-bottom: 25px; }
    .hero::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, var(--bg-color) 0%, rgba(3,7,18,0.4) 50%, rgba(3,7,18,0.85) 100%); }
    .hero-content { position: relative; z-index: 10; max-width: 700px; }
    .hero-title { font-size: 2.8rem; font-weight: 800; margin-bottom: 10px; text-shadow: 0 4px 15px rgba(0,0,0,0.8); line-height: 1.1; }
    .hero-desc { font-size: 1rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }

    main { padding: 0 5% 60px; }
    .section-title { font-size: 1.3rem; margin-bottom: 20px; font-weight: 700; border-left: 4px solid var(--primary); padding-left: 12px; }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; }
    .movie-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; cursor: pointer; position: relative; border: 1px solid var(--border-color); transition: 0.3s; }
    .movie-card:hover { transform: translateY(-6px); border-color: rgba(37, 99, 235, 0.5); box-shadow: 0 12px 30px rgba(0,0,0,0.7); z-index: 2; }
    .poster-container { position: relative; padding-top: 150%; }
    .poster-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    
    .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.6); backdrop-filter: blur(2px); display: flex; justify-content: center; align-items: center; opacity: 0; transition: 0.3s; }
    .movie-card:hover .play-overlay { opacity: 1; }
    .play-overlay i { font-size: 3rem; color: var(--primary); transform: scale(0.8); transition: 0.3s; }
    .movie-card:hover .play-overlay i { transform: scale(1); }
    
    .badge-rating { position: absolute; top: 8px; right: 8px; background: rgba(3, 7, 18, 0.85); color: var(--accent); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 4px; border: 1px solid rgba(245, 158, 11, 0.2); }
    .movie-info { padding: 12px; }
    .movie-title { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .movie-date { font-size: 0.8rem; color: var(--text-muted); }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.95); z-index: 9999; justify-content: center; align-items: center; padding: 0; }
    .modal.active { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .modal-content { background: var(--bg-color); width: 100%; max-width: 1100px; height: 100vh; max-height: 100vh; display: flex; flex-direction: column; position: relative; }
    @media (min-width: 1024px) { .modal { padding: 20px; } .modal-content { height: auto; border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.9); } }

    .close-btn { position: absolute; top: 15px; right: 15px; font-size: 1.4rem; color: #fff; cursor: pointer; z-index: 100; background: rgba(255,255,255,0.1); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .close-btn:hover { background: #ef4444; }

    .player-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; flex-shrink: 0; }
    .player-container::before { content: 'Menghubungkan Server Gacor...'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--text-muted); font-weight: 600; font-size: 0.95rem; z-index: 1; }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 2; background: transparent; }

    .server-controls { padding: 18px 20px; background: var(--card-bg); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .server-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .server-controls p { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
    
    .server-btn { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.3s; }
    .server-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .server-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 12px rgba(37, 99, 235, 0.4); }

    .episodes-container { display: none; padding: 12px 0; border-top: 1px solid var(--border-color); margin-top: 4px; }
    .episodes-container.active { display: block; }
    .episodes-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
    .season-select { background: #1e293b; color: #fff; border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; outline: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .episode-list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 160px; overflow-y: auto; }
    .ep-btn { background: #1e293b; color: var(--text-muted); border: 1px solid var(--border-color); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s; }
    .ep-btn:hover { color: #fff; background: #334155; }
    .ep-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .loader { border: 3px solid rgba(255, 255, 255, 0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 38px; height: 38px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (max-width: 768px) { header { flex-direction: column; padding: 12px; gap: 10px; } nav { width: 100%; justify-content: center; } .search-box { width: 100%; justify-content: space-between; } .hero-title { font-size: 2.1rem; } }
  </style>
</head>
<body>

  <header id="main-header">
    <a href="#" class="logo" onclick="switchTab('movie')"><i class="fa-solid fa-play"></i> Stream<span>Danz</span></a>
    <nav>
      <button class="nav-btn active" id="btn-movies" onclick="switchTab('movie')">Film</button>
      <button class="nav-btn" id="btn-anime" onclick="switchTab('anime')">TV & Anime</button>
      <button class="nav-btn" id="btn-topanime" onclick="switchTab('topanime')">Top Rating</button>
    </nav>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Cari film / anime...">
      <button onclick="searchContent()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <div class="hero" id="hero-banner" style="background-image: url('https://image.tmdb.org/t/p/original/m2zMgz46f7pA3m0p1zOaA1E1l1r.jpg');">
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title">Memuat Sistem...</h1>
      <p class="hero-desc" id="hero-desc">Menyiapkan koneksi streaming berkecepatan tinggi...</p>
    </div>
  </div>

  <main>
    <h2 class="section-title" id="section-title">Film Sedang Trending</h2>
    <div class="movie-grid" id="movie-grid"><div class="loader"></div></div>
  </main>

  <div class="modal" id="video-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></span>
      
      <div class="player-container">
        <iframe id="video-player" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="no-referrer"></iframe>
      </div>

      <div class="server-controls">
        <p><i class="fa-solid fa-server" style="color:var(--primary);"></i> Pilih Server Streaming Utama:</p>
        <div class="server-group">
          <button class="server-btn active" id="btn-sv1" onclick="changeServer(1)"><i class="fa-solid fa-bolt"></i> VidSrc CC</button>
          <button class="server-btn" id="btn-sv2" onclick="changeServer(2)"><i class="fa-solid fa-fire"></i> Embed SU</button>
          <button class="server-btn" id="btn-sv3" onclick="changeServer(3)"><i class="fa-solid fa-satellite-dish"></i> AutoEmbed</button>
          <button class="server-btn" id="btn-sv4" onclick="changeServer(4)"><i class="fa-solid fa-database"></i> SmashyStream</button>
        </div>

        <div class="episodes-container" id="episodes-box">
          <div class="episodes-header">
            <p><i class="fa-solid fa-list-ol"></i> Season & Episode:</p>
            <select id="season-select" class="season-select" onchange="onSeasonChange()"></select>
          </div>
          <div class="episode-list" id="episode-list"></div>
        </div>
      </div>
    </div>
            </div>
            <script>
    window.addEventListener('scroll', () => {
      const header = document.getElementById('main-header');
      if (window.scrollY > 40) header.style.background = 'rgba(3, 7, 18, 0.95)';
      else header.style.background = 'rgba(3, 7, 18, 0.85)';
    });

    const API_KEYS = [
      '8d6d91941230817f7807d643736e8a49',
      '04c35731a5ee918f014970082a0088b1',
      '284243b566580f146a48a43653199859',
      '3e6a392110bd0ceee096b02a249c5eeb',
      '15d2ea6d0dc1d476efbcea3eba2715d3'
    ];
    let currentKeyIndex = 0;
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';
    const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';

    let currentTab = 'movie'; 
    let currentVideoId = '';
    let currentMediaType = '';
    let currentServer = 1;
    let currentSeason = 1;
    let currentEpisode = 1;

    window.onload = () => {
      loadMovies();
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchContent();
      });
    };

    function getApiKey() { return API_KEYS[currentKeyIndex]; }

    function switchTab(type) {
      currentTab = type;
      document.getElementById('btn-movies').classList.toggle('active', type === 'movie');
      document.getElementById('btn-anime').classList.toggle('active', type === 'anime');
      document.getElementById('btn-topanime').classList.toggle('active', type === 'topanime');
      document.getElementById('search-input').value = ''; 
      
      if (type === 'movie') { document.getElementById('section-title').innerText = 'Film Sedang Trending'; loadMovies(); } 
      else if (type === 'anime') { document.getElementById('section-title').innerText = 'Serial & Anime Populer'; loadAnime(); } 
      else if (type === 'topanime') { document.getElementById('section-title').innerText = 'Top Rating Anime Terbaik'; loadTopAnime(); }
    }

    async function loadMovies() { fetchAndRender(`${BASE_URL}/trending/movie/week?language=id-ID`, 'movie'); }
    async function loadAnime() { fetchAndRender(`${BASE_URL}/trending/tv/week?language=id-ID`, 'tv'); }
    async function loadTopAnime() { fetchAndRender(`${BASE_URL}/discover/tv?with_genres=16&sort_by=vote_average.desc&vote_count.gte=50&language=id-ID`, 'tv'); }

    async function searchContent() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;
      const type = currentTab === 'movie' ? 'movie' : 'tv';
      document.getElementById('section-title').innerText = `Hasil Pencarian: "${query}"`;
      fetchAndRender(`${BASE_URL}/search/${type}?query=${encodeURIComponent(query)}&language=id-ID`, type, false); 
    }

    async function fetchAndRender(endpoint, mediaType, updateHero = true) {
      const grid = document.getElementById('movie-grid');
      if (currentKeyIndex === 0) grid.innerHTML = '<div style="grid-column: 1/-1;"><div class="loader"></div></div>';
      const url = endpoint.includes('?') ? `${endpoint}&api_key=${getApiKey()}` : `${endpoint}?api_key=${getApiKey()}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.success === false || data.status_code === 7) {
          currentKeyIndex++;
          if (currentKeyIndex < API_KEYS.length) return fetchAndRender(endpoint, mediaType, updateHero); 
          else { grid.innerHTML = `<div style="text-align:center; grid-column:1/-1;"><h3>Gagal Memuat API</h3><button onclick="currentKeyIndex=0; switchTab(currentTab)">Coba Lagi</button></div>`; return; }
        }
        currentKeyIndex = 0;

        if (!data.results || data.results.length === 0) { grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">Konten tidak ditemukan.</p>'; return; }

        if (updateHero && data.results.length > 0) {
          const heroItem = data.results[0];
          if (heroItem.backdrop_path) document.getElementById('hero-banner').style.backgroundImage = `url('${BACKDROP_URL}${heroItem.backdrop_path}')`;
          document.getElementById('hero-title').innerText = heroItem.title || heroItem.name;
          document.getElementById('hero-desc').innerText = heroItem.overview ? heroItem.overview.substring(0, 150) + "..." : "Selamat datang di Stream Danz.";
        }

        grid.innerHTML = ''; 
        data.results.forEach(item => {
          const title = item.title || item.name;
          const date = item.release_date || item.first_air_date || 'N/A';
          const poster = item.poster_path ? `${IMAGE_URL}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
          const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
          
          let forcedMediaType = mediaType;
          if (currentTab === 'anime' || currentTab === 'topanime') forcedMediaType = 'tv';
          else if (currentTab === 'movie') forcedMediaType = 'movie';
          else forcedMediaType = item.title ? 'movie' : 'tv';

          const card = document.createElement('div');
          card.className = 'movie-card';
          card.onclick = () => openPlayerModals(item.id, forcedMediaType);
          
          card.innerHTML = `
            <div class="poster-container"><img src="${poster}" alt="${title}" loading="lazy">
              <div class="play-overlay"><i class="fa-solid fa-circle-play"></i></div>
              <div class="badge-rating"><i class="fa-solid fa-star"></i> ${rating}</div>
            </div>
            <div class="movie-info"><div class="movie-title">${title}</div><div class="movie-date">${date.split('-')[0]}</div></div>`;
          grid.appendChild(card);
        });
      } catch (error) { grid.innerHTML = `<div style="text-align:center; grid-column:1/-1;"><p style="color:var(--text-muted);">Gagal terhubung ke jaringan.</p></div>`; }
    }

    async function openPlayerModals(tmdbId, mediaType) {
      currentVideoId = tmdbId;
      currentMediaType = mediaType;
      currentSeason = 1;
      currentEpisode = 1;

      const modal = document.getElementById('video-modal');
      const episodesBox = document.getElementById('episodes-box');
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; 

      if (currentMediaType === 'tv') {
        episodesBox.classList.add('active');
        await fetchTVDetails(currentVideoId);
      } else {
        episodesBox.classList.remove('active');
        updateStreamUrl();
      }
      changeServer(currentServer);
    }

    async function fetchTVDetails(id) {
      const episodesBox = document.getElementById('episodes-box');
      const epListContainer = document.getElementById('episode-list');
      epListContainer.innerHTML = '<span style="color:var(--text-muted); font-size:0.85rem;">Memuat daftar episode...</span>';

      try {
        const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${getApiKey()}&language=id-ID`);
        const showDetailsData = await res.json();
        
        if (!showDetailsData.seasons || showDetailsData.seasons.length === 0 || showDetailsData.success === false) {
          currentMediaType = 'movie'; 
          episodesBox.classList.remove('active');
          updateStreamUrl();
          return;
        }

        const seasonSelect = document.getElementById('season-select');
        seasonSelect.innerHTML = '';
        let validSeasons = showDetailsData.seasons.filter(s => s.season_number >= 1 && s.episode_count > 0);
        
        if (validSeasons.length === 0) {
          currentMediaType = 'movie';
          episodesBox.classList.remove('active');
          updateStreamUrl();
          return;
        }

        validSeasons.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.season_number;
          opt.innerText = `Season ${s.season_number} (${s.episode_count} Ep)`;
          seasonSelect.appendChild(opt);
        });
        
        currentSeason = parseInt(seasonSelect.value);
        await loadEpisodesList(id, currentSeason);
      } catch (e) {
        currentMediaType = 'movie';
        episodesBox.classList.remove('active');
        updateStreamUrl();
      }
    }

    function onSeasonChange() {
      const seasonSelect = document.getElementById('season-select');
      currentSeason = parseInt(seasonSelect.value);
      currentEpisode = 1;
      loadEpisodesList(currentVideoId, currentSeason);
    }

    async function loadEpisodesList(id, seasonNum) {
      const epListContainer = document.getElementById('episode-list');
      epListContainer.innerHTML = '<span style="color:var(--text-muted); font-size:0.85rem;">Memuat episode...</span>';

      try {
        const res = await fetch(`${BASE_URL}/tv/${id}/season/${seasonNum}?api_key=${getApiKey()}&language=id-ID`);
        const seasonData = await res.json();
        epListContainer.innerHTML = '';

        if (seasonData.episodes && seasonData.episodes.length > 0) {
          seasonData.episodes.forEach(ep => {
            const btn = document.createElement('button');
            btn.className = `ep-btn ${ep.episode_number === currentEpisode ? 'active' : ''}`;
            btn.innerText = `Ep ${ep.episode_number}`;
            btn.title = ep.name || `Episode ${ep.episode_number}`;
            btn.onclick = () => selectEpisode(ep.episode_number);
            epListContainer.appendChild(btn);
          });
          updateStreamUrl();
        } else {
          epListContainer.innerHTML = '<span style="color:var(--text-muted); font-size:0.85rem;">Episode belum tersedia.</span>';
          updateStreamUrl();
        }
      } catch (e) {
        epListContainer.innerHTML = '<span style="color:#ef4444; font-size:0.85rem;">Gagal memuat.</span>';
        updateStreamUrl();
      }
    }

    function selectEpisode(epNum) {
      currentEpisode = epNum;
      const buttons = document.querySelectorAll('.ep-btn');
      buttons.forEach(btn => {
        if (btn.innerText === `Ep ${epNum}`) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      updateStreamUrl();
    }

    function changeServer(serverNumber) {
      currentServer = serverNumber;
      for(let i=1; i<=4; i++) {
        document.getElementById(`btn-sv${i}`).classList.remove('active');
      }
      document.getElementById(`btn-sv${serverNumber}`).classList.add('active');
      updateStreamUrl();
    }

    function updateStreamUrl() {
      const player = document.getElementById('video-player');
      let embedUrl = '';
      
      if (currentMediaType === 'movie') {
        if (currentServer === 1) embedUrl = `https://vidsrc.cc/v2/embed/movie/${currentVideoId}`;
        if (currentServer === 2) embedUrl = `https://embed.su/embed/movie/${currentVideoId}`;
        if (currentServer === 3) embedUrl = `https://player.autoembed.co/embed/movie/${currentVideoId}`;
        if (currentServer === 4) embedUrl = `https://embed.smashystream.com/playere.php?tmdb=${currentVideoId}`;
      } else {
        if (currentServer === 1) embedUrl = `https://vidsrc.cc/v2/embed/tv/${currentVideoId}/${currentSeason}/${currentEpisode}`; 
        if (currentServer === 2) embedUrl = `https://embed.su/embed/tv/${currentVideoId}/${currentSeason}/${currentEpisode}`;
        if (currentServer === 3) embedUrl = `https://player.autoembed.co/embed/tv/${currentVideoId}/${currentSeason}/${currentEpisode}`;
        if (currentServer === 4) embedUrl = `https://embed.smashystream.com/playere.php?tmdb=${currentVideoId}&season=${currentSeason}&episode=${currentEpisode}`;
      }

      player.style.opacity = '0';
      player.src = embedUrl;
      setTimeout(() => {
        player.style.opacity = '1';
        player.style.transition = 'opacity 0.5s ease';
      }, 400);
    }

    function closeModal() {
      const modal = document.getElementById('video-modal');
      const player = document.getElementById('video-player');
      player.src = ''; 
      modal.classList.remove('active');
      document.body.style.overflow = 'auto'; 
    }

    window.onclick = function(event) {
      const modal = document.getElementById('video-modal');
      if (event.target === modal) closeModal();
    }
  </script>
</body>
  </html>
